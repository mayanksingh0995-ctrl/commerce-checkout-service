server:
  port: ${HTTP_PORT:8080}

spring:
  application:
    name: checkout-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5434/checkout}
    username: ${DATABASE_USERNAME:checkout}
    password: ${DATABASE_PASSWORD:checkout-local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  grpc:
    client:
      channels:
        inventory:
          address: ${INVENTORY_GRPC_ADDRESS:localhost:9091}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus